# nginx 接入片段 —— 项目管理平台（端口 80 + 路径前缀 /pm，与同机其它系统共存）
# 首页对外: http://<服务器IP>/pm
#
# 因服务器是共享的(根路径 / 与 /api、/data 可能被别的系统占用),本系统只接管 /pm/ 这一段路径:
# 前端已用 base=/pm/ 构建,且所有接口/数据请求都带 /pm 前缀(/pm/api、/pm/data),故不碰任何根路径。
#
# ============================================================================
# 用法 A(推荐,共享服务器): 把下面这个 location 块整段粘进现有监听 80 端口的 server { } 里
# (即别的系统已有的那个 server 块),然后 sudo nginx -t && sudo systemctl reload nginx。
# ============================================================================

    # —— 项目管理平台: 只接管 /pm/ —— (粘进现有 :80 的 server 块)
    location = /pm { return 301 /pm/; }
    location /pm/ {
        proxy_pass http://127.0.0.1:8080/;     # 末尾 / 关键: 把 /pm/xxx 重写成 /xxx 再发给 app
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;             # 允许上传 PMIS/CSV 大文件
        gzip on;                               # 主数据 ~12MB,gzip 后 ~0.85MB
        # ⚠ text/javascript 必须在列:后端 server.py 走自绘静态分支(_serve_static_with_charset)
        #   调 guess_type(),而 CPython mimetypes 硬编码表里 '.js' → text/javascript
        #   (Python 3.12 实测),**不是** application/javascript;server.py 全文无 extensions_map 覆盖。
        #   nginx 匹配 gzip_types 时按 ';' 截断只取主类型,故 charset 后缀不影响判断 ——
        #   漏了这一支,2.6MB 的前端主 chunk 会以原文下发(约 2,757,000 B → gzip 后约 1,037,000 B,
        #   单次冷加载白烧 1.64 MiB),而 CSS/JSON 因类型对得上却是正常压缩的,极难被察觉。
        #   application/javascript 一并保留:Linux 上 mimetypes 还会读 /etc/mime.types,
        #   不同发行版可能仍映射到旧类型名,两支都写才与来源无关。
        # ⚠ 切勿把 text/event-stream 加进来:SSE 进度流被 gzip 缓冲后进度条不再实时。
        gzip_types text/javascript application/javascript application/json text/css text/plain
                   image/svg+xml application/xml text/xml;
        gzip_min_length 1024;
        gzip_proxied any;                      # 客户端请求带 Via 头时(内网前置代理场景)默认会整个关掉 gzip
        proxy_buffering off;                   # SSE 进度流实时;对静态/数据无害
        proxy_read_timeout 3600s;              # 长耗时数据处理
    }

# ============================================================================
# 用法 B(本系统独占某域名/IP 时): 用下面这个独立 server 块(已含上面的 location)。
# 注意 server_name 要填本系统专用的域名或 IP,不要用 _ catch-all,以免抢占别的系统。
# ============================================================================
#
# server {
#     listen 80;
#     server_name pm.intranet.example;          # 改成本系统专用域名/IP
#     client_max_body_size 100M;
#     gzip on;
#     # text/javascript 必须在列,原因同「用法 A」块内注释(后端对 .js 返回 text/javascript)
#     gzip_types text/javascript application/javascript application/json text/css text/plain
#                image/svg+xml application/xml text/xml;
#     gzip_min_length 1024; gzip_proxied any;
#     location = /pm { return 301 /pm/; }
#     location /pm/ {
#         proxy_pass http://127.0.0.1:8080/;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_buffering off;
#         proxy_read_timeout 3600s;
#     }
# }
#
# 前端必须用 base=/pm/ 构建:  cd frontend && npm run build -- --base=/pm/
# 端口 80 = 明文 HTTP,会话/数据不加密。仅可信内网用;不可信网络改 443 + TLS(/pm 结构不变)。
