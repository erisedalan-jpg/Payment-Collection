# nginx 反向代理 —— 项目管理平台
# 安装:sudo cp deploy/nginx-pmplatform.conf /etc/nginx/sites-available/pmplatform
#       sudo ln -s /etc/nginx/sites-available/pmplatform /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#
# 作用:对内网终止 TLS(HTTPS) + gzip 压缩(冷加载 29.09 MiB → 4.14 MiB) + SSE 进度透传,
#       后端应用始终绑 127.0.0.1:8080(不对外暴露)。

server {
    listen 443 ssl;
    server_name pm.intranet.example;          # 改成你的内网域名或服务器 IP

    ssl_certificate     /etc/ssl/pmplatform/server.crt;   # 自签或内网 CA 签发
    ssl_certificate_key /etc/ssl/pmplatform/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100M;                # 允许上传 PMIS/CSV 大文件(/api/*upload)

    # gzip:2026-08-31 实测(生产 LF 换行口径,勿当常量——随数据量增长,引用前请重新 stat):
    #   analysis_data.json  17.44 MiB → gzip 1.16 MiB (15.1x)
    #   yitian_data.json     9.02 MiB → gzip 2.13 MiB ( 4.2x)  ← 紧凑写法,压缩比低,是冷加载大头
    #   前端主 chunk         2.63 MiB → gzip 0.85 MiB ( 3.1x)
    #   冷加载合计          29.09 MiB → gzip 4.14 MiB
    # 此前本文件两处写「12MB」,是 V2.x 时期的值,2026-08-31 审查时实测已低估 45%。
    gzip on;
    # ⚠ text/javascript 必须在列:后端 server.py 走自绘静态分支(_serve_static_with_charset)
    #   调 guess_type(),而 CPython mimetypes 硬编码表里 '.js' → text/javascript(Python 3.12 实测),
    #   **不是** application/javascript;server.py 全文无 extensions_map 覆盖。
    #   nginx 匹配 gzip_types 时按 ';' 截断只取主类型,故 charset 后缀不影响判断 ——
    #   漏了这一支,前端主 chunk 会以原文下发(2026-08-31 实测 2,758,434 B → gzip 后 890,070 B,
    #   单次冷加载白烧 1.78 MiB),而 CSS/JSON 因类型对得上却是正常压缩的,极难被察觉。
    #   application/javascript 一并保留:Linux 上 mimetypes 还会读 /etc/mime.types,
    #   不同发行版可能仍映射到旧类型名,两支都写才与来源无关。
    # ⚠ 切勿把 text/event-stream 加进来:SSE 进度流被 gzip 缓冲后进度条不再实时。
    gzip_types text/javascript application/javascript application/json text/css text/plain
               image/svg+xml application/xml text/xml;
    gzip_min_length 1024;
    gzip_proxied any;

    # 普通请求
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE 进度流端点:必须关缓冲,否则"数据更新/同步/导入"进度条不实时
    location ~ ^/api/(sync|reprocess|import|pmis) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;             # 长耗时数据处理
    }
}

# 可选:80 → 443 跳转
server {
    listen 80;
    server_name pm.intranet.example;
    return 301 https://$host$request_uri;
}
